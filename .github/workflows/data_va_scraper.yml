name: Daily Data Analyst & VA Job Digest

on:
  schedule:
    # 09:17 UTC = 10:17 WAT (UTC+1) — Monday through Friday.
    # Offset 10 min after the QA digest so the two GitHub Actions runners
    # don't compete for the same Gmail SMTP rate-limit bucket.
    - cron: "17 9 * * 1-5"
  workflow_dispatch:   # allow manual trigger from the Actions tab

jobs:
  scrape-and-email:
    name: Scrape DA/VA jobs & email digest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run DA/VA job scraper
        env:
          SENDER_EMAIL:    ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
        run: python scripts/data_va_scraper.py

      - name: Upload scraper log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: da-va-scraper-log-${{ github.run_id }}
          path: "*.log"
          if-no-files-found: ignore
